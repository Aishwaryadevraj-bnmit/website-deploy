<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps CI/CD Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            margin: 0;
        }

        header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            font-size: 24px;
        }

        .container {
            margin-top: 60px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
            color: black;
        }

        #status {
            margin-top: 20px;
            font-size: 22px;
            color: yellow;
        }

        .quiz-container {
            margin-top: 50px;
        }

        #options button {
            display: block;
            margin: 10px auto;
            width: 220px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.3);
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
    🚀 DevOps CI/CD Project using Jenkins
</header>

<div class="container">

    <h1>Hello from DevOps Project 🎉</h1>
    <p>Automated Deployment using Jenkins</p>

    <!-- Button -->
    <button onclick="showMessage()">Click Me</button>

    <!-- Trigger Jenkins -->
    <button onclick="triggerBuild()">Run Jenkins Build</button>

    <!-- Status -->
    <p id="status">Loading build status...</p>

    <!-- Quiz Section -->
    <div class="quiz-container">
        <h2>DevOps Quiz 🧠</h2>
        <p id="question"></p>
        <div id="options"></div>
        <button onclick="nextQuestion()">Next</button>
        <p id="score"></p>
    </div>

</div>

<footer>
    © 2026 DevOps Project
</footer>

<script>
    // Button alert
    function showMessage() {
        alert("Welcome! Your DevOps pipeline is working 🚀");
    }

    // Fetch build status
    function loadStatus() {
        fetch("status.txt")
            .then(res => res.text())
            .then(data => {
                document.getElementById("status").innerText = data;
            })
            .catch(() => {
                document.getElementById("status").innerText = "Error loading status";
            });
    }

    // Trigger Jenkins build (simple token method)
    function triggerBuild() {
        fetch("http://localhost:8080/job/my-project/build?token=123")
        .then(() => {
            alert("Build Triggered 🚀");
            setTimeout(loadStatus, 5000);
        })
        .catch(() => {
            alert("Failed to trigger build ❌");
        });
    }

    // Load status initially
    loadStatus();

    // QUIZ LOGIC
    const quiz = [
        {
            question: "What does CI/CD stand for?",
            options: ["Continuous Integration/Continuous Deployment", "Code Integration", "Central Deployment"],
            answer: 0
        },
        {
            question: "Which tool is used for automation?",
            options: ["GitHub", "Jenkins", "HTML"],
            answer: 1
        },
        {
            question: "Which server is used?",
            options: ["Apache", "Nginx", "Tomcat"],
            answer: 0
        },
        {
            question: "Where is code stored?",
            options: ["Jenkins", "GitHub", "XAMPP"],
            answer: 1
        }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
        document.getElementById("question").innerText = quiz[currentQ].question;

        let optionsHTML = "";
        quiz[currentQ].options.forEach((opt, index) => {
            optionsHTML += `<button onclick="checkAnswer(${index})">${opt}</button>`;
        });

        document.getElementById("options").innerHTML = optionsHTML;
    }

    function checkAnswer(selected) {
        if (selected === quiz[currentQ].answer) {
            score++;
        }
    }

    function nextQuestion() {
        currentQ++;

        if (currentQ < quiz.length) {
            loadQuestion();
        } else {
            document.getElementById("question").innerText = "Quiz Completed!";
            document.getElementById("options").innerHTML = "";
            document.getElementById("score").innerText = "Your Score: " + score;
        }
    }

    // Load first question
    loadQuestion();
</script>

</body>
</html>
