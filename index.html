<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps Quiz App</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        color: white;
        margin: 0;
    }

    header {
        padding: 20px;
        font-size: 26px;
        background: rgba(0,0,0,0.3);
    }

    .container {
        margin-top: 60px;
    }

    h1 {
        font-size: 40px;
    }

    button {
        padding: 12px;
        margin: 10px;
        width: 250px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        background: #ccc;
        color: black;
    }

    button:hover {
        background: white;
    }

    #options button {
        display: block;
        margin: 10px auto;
    }

    #nextBtn {
        background: black;
        color: white;
        width: 150px;
    }

    /* FINAL SCORE SCREEN */
    #resultBox {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        padding: 40px;
        border-radius: 12px;
        font-size: 28px;
    }
</style>
</head>

<body>

<header>
🚀 DevOps Quiz Application
</header>

<div class="container">

    <h1>DevOps Quiz 🧠</h1>

    <h2 id="question"></h2>

    <div id="options"></div>

    <button id="nextBtn" onclick="nextQuestion()">Next</button>

</div>

<!-- RESULT BOX -->
<div id="resultBox"></div>

<script>
const quiz = [
    {
        question: "What does CI/CD stand for?",
        options: [
            "Continuous Integration/Continuous Deployment",
            "Code Integration",
            "Central Deployment"
        ],
        answer: 0
    },
    {
        question: "Which tool is used for automation?",
        options: ["GitHub", "Jenkins", "HTML"],
        answer: 1
    },
    {
        question: "Where is code stored?",
        options: ["Jenkins", "GitHub", "XAMPP"],
        answer: 1
    },
    {
        question: "Which server is commonly used?",
        options: ["Apache", "MS Word", "Excel"],
        answer: 0
    }
];

let currentQ = 0;
let score = 0;
let selected = null;

function loadQuestion() {
    selected = null;

    document.getElementById("question").innerText = quiz[currentQ].question;

    let optionsHTML = "";
    quiz[currentQ].options.forEach((opt, index) => {
        optionsHTML += `<button id="opt${index}" onclick="selectOption(${index})">${opt}</button>`;
    });

    document.getElementById("options").innerHTML = optionsHTML;
}

function selectOption(index) {
    selected = index;

    // reset all buttons
    quiz[currentQ].options.forEach((_, i) => {
        document.getElementById("opt" + i).style.background = "#ccc";
    });

    // highlight selected
    document.getElementById("opt" + index).style.background = "orange";
}

function nextQuestion() {
    if (selected === null) {
        alert("Please select an answer!");
        return;
    }

    // correct / wrong color
    if (selected === quiz[currentQ].answer) {
        score++;
        document.getElementById("opt" + selected).style.background = "green";
    } else {
        document.getElementById("opt" + selected).style.background = "red";
        document.getElementById("opt" + quiz[currentQ].answer).style.background = "green";
    }

    setTimeout(() => {
        currentQ++;

        if (currentQ < quiz.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }, 800);
}

function showResult() {
    document.querySelector(".container").style.display = "none";

    let resultBox = document.getElementById("resultBox");
    resultBox.style.display = "block";

    resultBox.innerHTML = `
        🎉 Quiz Completed! <br><br>
        Your Score: ${score} / ${quiz.length}
    `;
}

// start quiz
loadQuestion();
</script>

</body>
</html>
